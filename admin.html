<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Control Panel - On VN Sustainability</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: radial-gradient(circle at 10% 20%, rgb(24, 18, 43) 0%, rgb(15, 12, 29) 90.2%);
      min-height: 100vh;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="p-6 max-w-4xl mx-auto">

  <header class="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center shadow-lg shadow-amber-500/30">
        <i class="fa-solid fa-crown text-slate-900 text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-300 to-orange-300">Host Control Dashboard</h1>
        <p class="text-xs text-slate-400">On VN Sustainability Team Contest (Trinh Access)</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="confirmResetGame()" class="px-4 py-2 rounded-xl bg-red-500/20 hover:bg-red-500/40 border border-red-500/40 text-xs font-bold text-red-300 transition flex items-center gap-2 shadow-lg">
        <i class="fa-solid fa-rotate-right"></i>
        <span>Reset Game</span>
      </button>
    </div>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="glass-card p-5 rounded-2xl text-center">
      <span class="text-xs text-slate-400 uppercase tracking-wider block mb-1">Active Stage</span>
      <span id="active-round-badge" class="text-lg font-black text-fuchsia-400">Loading...</span>
    </div>

    <div class="glass-card p-5 rounded-2xl text-center">
      <span class="text-xs text-slate-400 uppercase tracking-wider block mb-1">Votes In Current Round</span>
      <span id="voted-count-text" class="text-lg font-black text-emerald-400">0 / 9 Players</span>
    </div>

    <div class="glass-card p-5 rounded-2xl flex items-center justify-center">
      <button id="btn-next-round" onclick="unlockNextRound()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg transition flex items-center justify-center gap-2">
        <span>Proceed to Next Round</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <section class="glass-card p-6 rounded-2xl shadow-2xl space-y-6">
    <div class="flex items-center justify-between border-b border-white/10 pb-3">
      <h2 class="text-base font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-chart-line text-amber-400"></i> Live Tally Results
      </h2>
      <span class="text-[11px] text-emerald-400 font-semibold animate-pulse flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Updating (1.2s)
      </span>
    </div>

    <div id="results-display-container" class="space-y-6">
      <div class="text-center py-8 text-slate-500 text-xs">Loading live results...</div>
    </div>
  </section>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzXLzCATb-D9tO_LH-8bJV4o1OS1RTk7CGxjX1wE-nqVXi7YJVZ2aWiqqLQadEteiHKlA/exec";
    const ADMIN_USER = "Trinh";
    const TOTAL_PLAYERS = 9;

    let QUESTIONS = [];
    let activeRoundOnServer = 0;

    window.onload = function() {
      loadQuestionsAndSync();
      setInterval(syncAdminData, 1200);
    };

    async function loadQuestionsAndSync() {
      try {
        const res = await fetch(API_URL + "?action=getQuestions");
        const data = await res.json();
        QUESTIONS = data.questions || [];
        activeRoundOnServer = parseInt(data.activeRound || 0, 10);
        await syncAdminData();
      } catch (err) {
        console.error("Error loading questions:", err);
      }
    }

    async function syncAdminData() {
      try {
        const resState = await fetch(`${API_URL}?action=getVoterState&voter=${encodeURIComponent(ADMIN_USER)}`);
        const dataState = await resState.json();
        
        activeRoundOnServer = parseInt(dataState.activeRound || 0, 10);
        const votedCounts = dataState.votedCounts || {};
        const currentRoundCount = votedCounts[activeRoundOnServer] || 0;

        document.getElementById("active-round-badge").textContent = `Round ${activeRoundOnServer + 1} (${getRoundName(activeRoundOnServer)})`;
        document.getElementById("voted-count-text").textContent = `${currentRoundCount} / ${TOTAL_PLAYERS} Players`;

        const btnNext = document.getElementById("btn-next-round");
        if (activeRoundOnServer >= QUESTIONS.length - 1) {
          btnNext.disabled = true;
          btnNext.className = "w-full py-3 bg-slate-800 text-slate-500 font-bold text-xs rounded-xl cursor-not-allowed";
          btnNext.innerHTML = `<span>Final Round Active</span>`;
        } else {
          btnNext.disabled = false;
          btnNext.className = "w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold text-xs rounded-xl shadow-lg hover:from-amber-400 hover:to-orange-400 transition flex items-center justify-center gap-2";
          btnNext.innerHTML = `<span>Proceed to Round ${activeRoundOnServer + 2}</span> <i class="fa-solid fa-arrow-right"></i>`;
        }

        fetchLiveResults();
      } catch (err) {
        console.error("Sync Admin Error:", err);
      }
    }

    async function fetchLiveResults() {
      try {
        const res = await fetch(`${API_URL}?action=getResults&voter=${encodeURIComponent(ADMIN_USER)}`);
        const data = await res.json();
        if (data.status === "UNLOCKED") {
          renderResults(data.results);
        }
      } catch (err) {
        console.error("Fetch Results Error:", err);
      }
    }

    function renderResults(tallyData) {
      const container = document.getElementById("results-display-container");
      container.innerHTML = "";

      QUESTIONS.slice(0, activeRoundOnServer + 1).forEach((q, idx) => {
        const qResults = tallyData[q.id] || {};

        const sorted = Object.keys(qResults).map(key => ({
          label: key,
          votes: qResults[key]
        })).sort((a, b) => b.votes - a.votes);

        const highestVotes = sorted.length > 0 ? sorted[0].votes : 0;

        const sectionCard = document.createElement("div");
        sectionCard.className = "bg-white/5 p-4 rounded-xl border border-white/10 space-y-3";
        sectionCard.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-amber-400/20 text-amber-300 font-bold text-xs flex items-center justify-center">${idx + 1}</span>
            <h3 class="text-sm font-bold text-white">${q.title}</h3>
          </div>
        `;

        const listContainer = document.createElement("div");
        listContainer.className = "space-y-2 pt-1";

        if (sorted.length === 0) {
          listContainer.innerHTML = `<p class="text-xs text-slate-500 italic">No votes submitted for this round yet.</p>`;
        } else {
          sorted.forEach((res, rank) => {
            const isWinner = res.votes === highestVotes && res.votes > 0;
            const item = document.createElement("div");
            item.className = `p-3 rounded-lg border transition ${
              isWinner 
                ? 'bg-amber-500/10 border-amber-500/40 ring-1 ring-amber-400/30' 
                : 'bg-white/5 border-white/5'
            }`;

            item.innerHTML = `
              <div class="flex justify-between items-center text-xs">
                <div class="flex items-center gap-2">
                  ${isWinner ? '<i class="fa-solid fa-crown text-amber-400 text-xs"></i>' : `<span class="text-slate-500 font-mono">#${rank + 1}</span>`}
                  <span class="font-semibold ${isWinner ? 'text-amber-200' : 'text-slate-200'}">${res.label}</span>
                </div>
                <span class="font-bold ${isWinner ? 'text-amber-400' : 'text-slate-400'}">${res.votes} votes</span>
              </div>
            `;
            listContainer.appendChild(item);
          });
        }

        sectionCard.appendChild(listContainer);
        container.appendChild(sectionCard);
      });
    }

    async function unlockNextRound() {
      const btn = document.getElementById("btn-next-round");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Unlocking...`;

      const nextR = activeRoundOnServer + 1;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "setRound", voter: ADMIN_USER, round: nextR })
        });
        const data = await res.json();
        if (data.success) {
          activeRoundOnServer = nextR;
          await syncAdminData();
        } else {
          alert("Could not update round on server!");
        }
      } catch (e) {
        alert("Failed to unlock next round.");
      } finally {
        btn.disabled = false;
      }
    }

    async function confirmResetGame() {
      if (!confirm("⚠️ Host Trinh ơi, bạn có chắc chắn muốn RESET TOÀN BỘ GAME không?")) return;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "resetGame" })
        });
        const data = await res.json();
        if (data.success) {
          alert("✅ Đã reset toàn bộ game thành công!");
          activeRoundOnServer = 0;
          await syncAdminData();
        }
      } catch (err) {
        alert("Reset failed.");
      }
    }

    function getRoundName(idx) {
      if (idx === 0) return "Solo Stage";
      if (idx === 1) return "Duet Stage";
      if (idx === 2) return "Group Stage";
      return "Final";
    }
  </script>
</body>
</html>
