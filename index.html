<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>On VN Sustainability Team Singing Contest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at 10% 20%, rgb(24, 18, 43) 0%, rgb(15, 12, 29) 90.2%);
      min-height: 100vh;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .glass-input {
      background: rgba(15, 12, 29, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    select option { background-color: #1a1528; color: #ffffff; }
    
    .custom-checkbox:checked + label {
      background: rgba(217, 70, 239, 0.25);
      border-color: #d946ef;
      color: #ffffff;
    }
    .custom-checkbox:checked + label .check-icon { opacity: 1; }
  </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

  <header class="w-full max-w-md flex justify-between items-center mb-4 px-1">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-fuchsia-600 to-amber-400 flex items-center justify-center shadow-lg shadow-fuchsia-500/30">
        <i class="fa-solid fa-microphone-lines text-white text-sm"></i>
      </div>
      <span class="font-bold text-sm sm:text-base tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-300 via-pink-200 to-amber-200">On VN Sustainability</span>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="toggleQRModal()" class="px-3 py-1.5 rounded-full glass-card hover:bg-white/20 text-xs font-semibold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-qrcode text-fuchsia-400"></i>
        <span>Share QR</span>
      </button>

      <button id="admin-reset-btn" onclick="confirmResetGame()" title="Reset Game for Everyone" class="px-3 py-1.5 rounded-full bg-red-500/20 hover:bg-red-500/40 border border-red-500/40 text-xs font-bold text-red-300 transition flex items-center gap-1.5 shadow-lg hidden">
        <i class="fa-solid fa-rotate-right"></i>
        <span>Reset</span>
      </button>
    </div>
  </header>

  <main class="w-full max-w-md">

    <section id="step-identity" class="glass-card rounded-2xl p-6 shadow-2xl relative overflow-hidden transition-all duration-300">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 bg-fuchsia-500/10 rounded-2xl border border-fuchsia-500/20 mb-3 text-fuchsia-400 text-2xl">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <h1 class="text-xl font-black text-white uppercase tracking-wider">Singing Contest</h1>
        <p class="text-xs text-slate-400 mt-1">Select your name to start voting.</p>
      </div>

      <div class="space-y-4">
        <div>
          <label for="user-select" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Your Name</label>
          <div class="relative">
            <select id="user-select" class="glass-input w-full px-4 py-3.5 rounded-xl appearance-none pr-10 text-base">
              <option value="">-- Choose your name --</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
          </div>
        </div>

        <button id="btn-start" onclick="handleStartVote()" class="w-full mt-2 py-3.5 bg-gradient-to-r from-fuchsia-600 to-pink-600 hover:from-fuchsia-500 hover:to-pink-500 active:scale-[0.98] rounded-xl font-bold text-white shadow-lg shadow-fuchsia-600/30 transition flex items-center justify-center gap-2">
          <span>Enter Voting Room</span>
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>
      </div>
    </section>

    <section id="step-vote" class="glass-card rounded-2xl p-6 shadow-2xl relative overflow-hidden hidden transition-all duration-300">
      <div id="round-stepper" class="flex items-center justify-between mb-5 px-2 text-xs font-bold border-b border-white/10 pb-3">
        <div id="step-tab-0" class="text-fuchsia-400 flex items-center gap-1">
          <span class="w-5 h-5 rounded-full bg-fuchsia-500/20 flex items-center justify-center text-[10px]">1</span> Solo
        </div>
        <i class="fa-solid fa-angle-right text-slate-600 text-[10px]"></i>
        <div id="step-tab-1" class="text-slate-500 flex items-center gap-1">
          <span class="w-5 h-5 rounded-full bg-white/5 flex items-center justify-center text-[10px]">2</span> Duo
        </div>
        <i class="fa-solid fa-angle-right text-slate-600 text-[10px]"></i>
        <div id="step-tab-2" class="text-slate-500 flex items-center gap-1">
          <span class="w-5 h-5 rounded-full bg-white/5 flex items-center justify-center text-[10px]">3</span> Group
        </div>
      </div>

      <div class="flex items-center justify-between mb-4">
        <div>
          <span id="round-badge-title" class="text-xs font-semibold text-fuchsia-400 uppercase tracking-wider">Round 1</span>
          <h2 id="vote-greeting" class="text-lg font-bold text-white">Hello Player</h2>
        </div>
        <span class="px-2.5 py-1 rounded-full text-[11px] font-medium bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30 flex items-center gap-1">
          <i class="fa-solid fa-shield-halved text-[10px]"></i> Self-vote locked
        </span>
      </div>

      <div id="single-question-card" class="bg-white/5 p-4 rounded-xl border border-white/10 space-y-3"></div>

      <div class="mt-6 pt-4 border-t border-white/10">
        <button id="btn-submit-round" onclick="handleSubmitRound()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 active:scale-[0.98] rounded-xl font-bold text-white shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span id="btn-submit-text">Submit Round Vote</span>
        </button>
      </div>
    </section>

    <section id="step-status" class="glass-card rounded-2xl p-6 shadow-2xl relative overflow-hidden hidden transition-all duration-300">
      
      <div id="status-intermission" class="hidden text-center py-4 space-y-4">
        <div class="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center mx-auto text-2xl">
          <i class="fa-solid fa-check"></i>
        </div>
        <h2 id="intermission-title" class="text-xl font-black text-white">Round Submitted!</h2>
        <p class="text-xs text-slate-300 max-w-xs mx-auto">Your vote for this round has been recorded. Please wait for the Host to open the next round.</p>
        
        <div class="pt-2">
          <button onclick="syncVoterState()" class="px-4 py-2 bg-white/10 hover:bg-white/20 active:scale-95 border border-white/15 rounded-xl text-xs font-semibold text-fuchsia-300 transition inline-flex items-center gap-2 shadow">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Refresh Round Status</span>
          </button>
        </div>

        <div id="host-round-control" class="p-4 bg-amber-500/10 rounded-xl border border-amber-500/30 mt-4 space-y-3 hidden">
          <p class="text-xs text-amber-300 font-semibold"><i class="fa-solid fa-crown mr-1"></i> Host Control Panel</p>
          <button id="btn-host-next" onclick="hostUnlockNextRound()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 rounded-xl text-xs font-bold text-slate-900 shadow-lg transition flex items-center justify-center gap-2">
            <span>Unlock Next Round for Everyone</span>
            <i class="fa-solid fa-lock-open"></i>
          </button>
        </div>
